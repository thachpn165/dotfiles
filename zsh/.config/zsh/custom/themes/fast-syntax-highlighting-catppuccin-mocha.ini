; Catppuccin Mocha theme for fast-syntax-highlighting
; Colors: https://github.com/catppuccin/catppuccin
;
; Palette (256-color codes):
;   blue=#89b4fa  mauve=#cba6f7  green=#a6e3a1  peach=#fab387
;   red=#f38ba8   yellow=#f9e2af teal=#94e2d5   lavender=#b4befe
;   overlay0=#6c7086  surface1=#45475a

[base]
default          = none
unknown-token    = red,bold
commandseparator = none
redirection      = 183
here-string-tri  = 223
here-string-text = 110
here-string-var  = 116,bg:236
exec-descriptor  = 183,bold
comment          = 243
correct-subtle   = 110
incorrect-subtle = red
subtle-separator = 110
subtle-bg        = bg:236
secondary        = free
recursive-base   = 183

[command-point]
reserved-word  = 183
subcommand     = 183
alias          = 110
suffix-alias   = 110
global-alias   = bg:110
builtin        = 110
function       = 110
command        = 110
precommand     = 183
hashed-command = 110
single-sq-bracket = 110
double-sq-bracket = 110
double-paren   = 223

[paths]
path          = 116
pathseparator =
path-to-dir   = 116,underline
globbing      = 183,bold
globbing-ext  = 183

[brackets]
paired-bracket  = bg:110
bracket-level-1 = 110,bold
bracket-level-2 = 183,bold
bracket-level-3 = 116,bold

[arguments]
single-hyphen-option   = 146
double-hyphen-option   = 146
back-quoted-argument   = none
single-quoted-argument = 223
double-quoted-argument = 223
dollar-quoted-argument = 223
optarg-string          = 223
optarg-number          = 183

[in-string]
back-dollar-quoted-argument           = 116
back-or-dollar-double-quoted-argument = 116

[other]
variable             = 216
assign               = none
assign-array-bracket = 110
history-expansion    = 110,bold

[math]
mathvar = 110,bold
mathnum = 183
matherr = red

[for-loop]
forvar  = none
fornum  = 183
foroper = 223
forsep  = 223,bold

[case]
case-input       = 110
case-parentheses = 223
case-condition   = bg:110

