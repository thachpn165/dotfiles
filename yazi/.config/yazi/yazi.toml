"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 8
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 1000
max_height = 1400
image_delay = 20
image_filter = "triangle"
image_quality = 70

[opener]
edit = [
  { run = "nvim %s", desc = "nvim", for = "unix", block = true },
  { run = "code %s", desc = "code", for = "windows", orphan = true },
  { run = "code -w %s", desc = "code (block)", for = "windows", block = true },
]

[open]
prepend_rules = [
  { url = "*.{md,markdown,txt,log,conf,ini,env,toml,yaml,yml,json,sh,bash,zsh,fish,lua,py,js,ts,tsx,jsx,php,sql}", use = ["edit", "reveal"] },
]
